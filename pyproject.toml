[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veridex"
version = "0.1.0.dev0"
description = "Evidence-driven QA workflow and knowledge engine for AI-assisted testing"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "TUVGO" }]

[project.scripts]
veridex = "qa_brain.cli:main"

[tool.setuptools]
py-modules = ["workflow", "execute_case", "qa_evidence", "uat_write"]

[tool.setuptools.packages.find]
include = ["qa_core*", "qa_brain*"]
